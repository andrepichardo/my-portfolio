<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>TypeScript</title><!--
  Rebuilt from the simple-icons glyph, which packs the square and the lettering
  into one path and leaves the letters as holes in it. Two problems came with
  that: the letters took the colour of the page behind them (dark "TS" in dark
  mode, where the real mark is white), and they are drawn noticeably larger than
  the ones in the JavaScript icon beside it — 1.19x the width and 35% more ink —
  so the pair looked mismatched in the skills grid.

  Now the square is its own rect and the letters are their own painted paths, so
  they can be sized independently. The 0.9 scale is anchored on the lettering's
  bottom-right corner (21.888, 21.888), which keeps the right and bottom margins
  the mark is drawn with and brings the cap height in line with JavaScript's.
